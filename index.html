<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating Your Key...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h1>Generating Key...</h1>
        <p>Your download should start automatically.</p>
        <p>If it didn't, click the button below:</p>
        <button onclick="generateAndDownload()">Download key.txt</button>
    </div>

    <script>
    function generateAndDownload() {
        const referrer = document.referrer.toLowerCase();
        
        // CHECK: If the user didn't come from a LootLabs domain, deny access.
        // Also allows 'localhost' or empty for your own testing if needed.
        const isAuthorized = referrer.includes("loot") || 
                             referrer.includes("loot-link") || 
                             window.location.hostname === "localhost";

        if (!isAuthorized) {
            document.querySelector('.container').innerHTML = `
                <div style="color: #e74c3c; padding: 20px;">
                    <svg style="width: 48px; height: 48px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <h1>Access Denied</h1>
                    <p>Please complete the steps at the official link first.</p>
                </div>
            `;
            return;
        }

        // Generate the key
        const randomDigits = Math.floor(Math.random() * 9000000000000) + 1000000000000;
        const content = "NEXA-" + randomDigits;
        
        const blob = new Blob([content], { type: 'text/plain' });
        const element = document.createElement('a');
        element.href = URL.createObjectURL(blob);
        element.download = "key.txt";
        
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }

    window.onload = function() {
        setTimeout(generateAndDownload, 500);
    };
</script>
</body>
</html>
