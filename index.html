<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA Key System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 12px;
            background: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            border: 1px solid #334155;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #38bdf8; }
        .key-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            min-height: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #0ea5e9; }
        .status-msg { margin-top: 15px; font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>NEXA Key</h1>
        <div class="key-box" id="key-display">Loading...</div>
        <button onclick="copyKey()" id="copy-btn">Copy Key</button>
        <div class="status-msg" id="status-text">Validating session...</div>
    </div>

    <script>
        const STORAGE_KEY = "nexa_persistent_key";

        function handleKeyLogic() {
            const keyDisplay = document.getElementById('key-display');
            const statusText = document.getElementById('status-text');
            const referrer = document.referrer.toLowerCase();
            
            // 1. Check if a key already exists in the browser
            const savedKey = localStorage.getItem(STORAGE_KEY);

            if (savedKey) {
                // If found, show it and STOP. Do not generate a new one.
                keyDisplay.innerText = savedKey;
                statusText.innerText = "Current session key active.";
                return;
            }

            // 2. If no saved key, check if they came from LootLabs
            const isAuthorized = referrer.includes("loot") || 
                                 referrer.includes("loot-link") || 
                                 window.location.hostname === "localhost";

            if (!isAuthorized) {
                document.getElementById('main-content').innerHTML = `
                    <h1 style="color: #ef4444;">Access Denied</h1>
                    <p>Please use the official ad-link to get a key.</p>
                `;
                return;
            }

            // 3. Generate exactly ONE new key and save it immediately
            const randomID = Math.floor(Math.random() * 9000000000000) + 1000000000000;
            const newKey = "NEXA-" + randomID;
            
            localStorage.setItem(STORAGE_KEY, newKey);
            keyDisplay.innerText = newKey;
            statusText.innerText = "New key generated and locked.";
        }

        function copyKey() {
            const text = document.getElementById('key-display').innerText;
            if (text === "Loading..." || text.includes("Denied")) return;

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "Copied!";
                btn.style.backgroundColor = "#22c55e";
                setTimeout(() => {
                    btn.innerText = "Copy Key";
                    btn.style.backgroundColor = "#38bdf8";
                }, 2000);
            });
        }

        // Execute immediately
        handleKeyLogic();
    </script>
</body>
</html>
